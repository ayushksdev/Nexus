server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nexusdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

nexus:
  retry:
    max-attempts: 5
    base-delay-ms: 1000
  worker:
    max-restarts: 5
    restart-base-delay-ms: 1000
    healthy-settling-period-ms: 30000
  release:
    watch-period-ms: 30000

logging:
  level:
    root: INFO
    com.nexus: DEBUG
    org.hibernate.SQL: INFO
